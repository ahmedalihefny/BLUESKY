<style>
:root{--navy:#0A2A66;--sky:#0B96E8;--pale:#EAF6FF;--line:#D3E8F7;--red:#D81F26;--ink:#1c2740;--wa:#25D366}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,Arial,sans-serif;background:var(--pale);color:var(--ink);padding-bottom:84px}
button,input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}.brand img{width:42px;height:42px;border-radius:50%;background:#fff}
.cartbtn{border:0;background:var(--sky);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer}
#badge{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:4px;border-radius:11px;background:#fff;color:var(--navy);font-size:13px;text-align:center}
.cover{display:block;width:100%;max-width:1100px;margin:0 auto;height:auto}
.tools,.grid,.foot{max-width:1100px;margin:0 auto;padding:0 12px}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;min-width:0}
.chips{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 15px;cursor:pointer;color:var(--navy);font-weight:500}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.ph{aspect-ratio:3/4;background:var(--pale);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}.ph img.fb{width:45%;height:auto;opacity:.5}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.5;min-height:45px}
.pr{color:var(--red);font-weight:800;font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.opts label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#5b6b88}
.opts select{width:100%;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.btn,.add{border:0;border-radius:12px;background:var(--sky);color:#fff;font-weight:700;padding:11px;cursor:pointer}
.add{margin-top:auto}
.empty{grid-column:1/-1;text-align:center;padding:30px}
.foot{text-align:center;color:#5b6b88;font-size:13px;margin-top:22px}
.wa{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:30px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.55);z-index:40}
.drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(440px,100%);background:#fff;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--navy);color:#fff;font-size:18px}
.x{border:0;background:rgba(0,0,0,.45);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.db{overflow:auto;padding:14px;flex:1}
.it{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.it small{display:block;color:#5b6b88}.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
.rm{border:0;background:none;color:var(--red);cursor:pointer}
.row{display:flex;justify-content:space-between;padding:5px 0}.tot{font-weight:800;font-size:18px;color:var(--navy)}
.cp{display:flex;gap:6px;margin:12px 0}
.f label{display:block;margin:10px 0 4px;font-weight:700;font-size:14px}
.f input,.f textarea,.cp input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.f .pay{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0}.f .pay input{width:auto;margin-top:5px}
.err{color:var(--red);font-size:13px;min-height:18px}.ok{text-align:center;padding:20px 6px}.ok h3{color:var(--navy)}
.pop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,15,40,.6)}
[hidden]{display:none!important}
.pbox{max-height:92vh;overflow:auto;position:relative;width:min(360px,100%);background:#fff;border-radius:18px;overflow:hidden;text-align:center}
.pbox .x{position:absolute;top:8px;left:8px}.pbox img{width:100%;display:block}.pin{padding:22px 18px}
.pin h2{margin:0 0 6px;color:var(--navy);font-size:28px}.pin p{margin:0 0 14px}
.pcode{border:2px dashed var(--red);border-radius:12px;padding:8px;margin-bottom:14px;font-size:26px;font-weight:800;color:var(--red)}
.pin small{display:block;margin-top:10px;color:#7a869c}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.instbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:var(--navy)}
.instbar span{flex:1}.instbar button{border:0;border-radius:10px;padding:8px 16px;background:var(--sky);color:#fff;font-weight:700;cursor:pointer}
.instbar #instx{background:none;color:#7a869c;font-size:22px;padding:0 6px}

</style>

function render(){var l=P.filter(function(p){return(!cat||p.family===cat)&&p.name.indexOf(q.trim())>-1});
 var b=function(p){return p.prices[90]};
 if(sort==="asc")l.sort(function(x,y){return b(x)-b(y)});if(sort==="desc")l.sort(function(x,y){return b(y)-b(x)});
 $("#grid").innerHTML=l.map(card).join("")||'<p class="empty">لا توجد نتائج. جرّب كلمة أخرى أو اختر "الكل".</p>'}
$("#q").oninput=function(){q=this.value;render()};$("#sort").onchange=function(){sort=this.value;render()};
$("#chips").onclick=function(e){var c=e.target.getAttribute("data-c");if(!c)return;cat=c==="الكل"?"":c;chips();render()};
$("#grid").onchange=function(e){if(!e.target.classList.contains("w"))return;var c=e.target.closest(".card");c.querySelector(".pr").textContent=fmt(prod(+c.dataset.id).prices[e.target.value])};
$("#grid").onclick=function(e){if(!e.target.classList.contains("add"))return;var c=e.target.closest(".card"),id=+c.dataset.id,w=+c.querySelector(".w").value,l=+c.querySelector(".l").value,n=+c.querySelector(".n").value;
 var f=cart.filter(function(i){return i.id===id&&i.w===w&&i.l===l})[0];if(f)f.n=Math.min(f.n+n,50);else cart.push({id:id,w:w,l:l,n:n});
 save();count();e.target.textContent="✓ تمت الإضافة";setTimeout(function(){e.target.textContent="أضف للسلة"},1200)};
function count(){$("#badge").textContent=cart.reduce(function(s,i){return s+i.n},0)}
function sub(){return cart.reduce(function(s,i){return s+prod(i.id).prices[i.w]*i.n},0)}
function open(){$("#ov").hidden=false;$("#drawer").hidden=false;drawer()}
function close(){$("#ov").hidden=true;$("#drawer").hidden=true}
$("#cartBtn").onclick=open;$("#cx").onclick=close;$("#ov").onclick=close;
function drawer(msg){var b=$("#dbody");
